<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ولنتاین</title>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1a0f2b;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --yes:#47d18c;
      --no:#ff5a6a;
    }

    *{
      box-sizing:border-box;
      font-family: system-ui, -apple-system, Vazirmatn, Tahoma, Arial;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;

      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,90,106,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 10%, rgba(71,209,140,.18), transparent 60%),
        radial-gradient(900px 700px at 50% 120%, rgba(120,80,255,.20), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));

      color: var(--text);
      padding: 18px;
      overflow:hidden;
    }

    .card{
      width:min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      position: relative;
      text-align:center;
      backdrop-filter: blur(10px);
    }

    h1{
      margin: 6px 0 10px;
      font-size: clamp(20px, 4vw, 32px);
    }

    .stage{
      position: relative;
      width: min(560px, 100%);
      height: 260px;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,.16);
      background: rgba(0,0,0,.14);
      overflow: hidden;
    }

    .btn{
      border: 0;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size:16px;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }

    .btn:active{ transform: scale(.98); }

    .yes{
      background: linear-gradient(135deg, rgba(71,209,140,1), rgba(71,209,140,.7));
      color:#062014;
    }

    .no{
      position:absolute;
      background: linear-gradient(135deg, rgba(255,90,106,1), rgba(255,90,106,.75));
      color:#2b0006;
    }

    .result{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
    }

    .result.show{
      opacity:1;
      pointer-events:auto;
    }

    .heart{
      font-size:80px;
      animation: pop .6s ease forwards, float 1.8s ease-in-out infinite .6s;
    }

    @keyframes pop{
      0%{ transform: scale(.6); opacity:0; }
      100%{ transform: scale(1); opacity:1; }
    }

    @keyframes float{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-10px); }
    }

  </style>
</head>

<body>

  <div class="card">
    <h1>
      سارای عزیزم<br>
      با من ازدواج میکنی؟
    </h1>

    <div class="stage" id="stage">

      <button class="btn yes" id="yesBtn"
        style="position:absolute; left:35%; top:60%;">
        بله
      </button>

      <button class="btn no" id="noBtn"
        style="left:65%; top:60%;">
        نه
      </button>

      <div class="result" id="result">
        <div>
          <div class="heart">❤️</div>
          <h2>دوستت دارم 💖</h2>
        </div>
      </div>

    </div>
  </div>

<script>
const stage = document.getElementById("stage");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const result = document.getElementById("result");

function moveNo(){
  const rect = stage.getBoundingClientRect();
  const x = Math.random() * (rect.width - 100);
  const y = Math.random() * (rect.height - 50);

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("click", e=>{
  e.preventDefault();
  moveNo();
});

yesBtn.addEventListener("click", ()=>{
  result.classList.add("show");
});
</script>

</body>
</html>
