<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ولنتاین</title>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1a0f2b;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
    }

    *{ box-sizing:border-box; font-family: system-ui, -apple-system, Vazirmatn, Tahoma, Arial; }

    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,90,106,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 10%, rgba(71,209,140,.18), transparent 60%),
        radial-gradient(900px 700px at 50% 120%, rgba(120,80,255,.20), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      padding: 18px;
      overflow:hidden;
    }

    .card{
      width:min(720px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align:center;
      backdrop-filter: blur(10px);
    }

    h1{ margin: 6px 0 10px; font-size: clamp(20px, 4vw, 32px); }

    .stage{
      position: relative;
      width: min(560px, 100%);
      height: 260px;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,.16);
      background: rgba(0,0,0,.14);
      overflow: hidden;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn{
      position:absolute;
      border: 0;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size:16px;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:active{ transform: scale(.98); }

    .yes{
      background: linear-gradient(135deg, rgba(71,209,140,1), rgba(71,209,140,.7));
      color:#062014;
    }
    .no{
      background: linear-gradient(135deg, rgba(255,90,106,1), rgba(255,90,106,.75));
      color:#2b0006;
    }

    .result{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
    }
    .result.show{ opacity:1; pointer-events:auto; }

    .heart{
      font-size:80px;
      animation: pop .6s ease forwards, float 1.8s ease-in-out infinite .6s;
    }
    @keyframes pop{ 0%{ transform: scale(.6); opacity:0; } 100%{ transform: scale(1); opacity:1; } }
    @keyframes float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }

    /* Meme overlay */
    .meme{
      position:absolute;
      inset:0;
      display:none;
      background: rgba(0,0,0,.45);
      z-index: 50;
      cursor:pointer;
    }
    .meme.show{ display:block; }
    .meme img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>
      سارای عزیزم<br>
      با من ازدواج میکنی؟
    </h1>

    <div class="stage" id="stage">
      <button class="btn yes" id="yesBtn" style="left:35%; top:60%;">بله</button>
      <button class="btn no"  id="noBtn"  style="left:65%; top:60%;">نه</button>

      <div class="result" id="result">
        <div>
          <div class="heart">❤️</div>
          <h2>دوستت دارم 💖</h2>
        </div>
      </div>

      <div class="meme" id="meme" title="کلیک کن تا برگرده">
        <img id="memeImg" alt="meme" />
      </div>
    </div>
  </div>

<script>
  const stage  = document.getElementById("stage");
  const noBtn  = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const result = document.getElementById("result");
  const meme   = document.getElementById("meme");
  const memeImg= document.getElementById("memeImg");

  // Base64 meme (self-contained) — اگر خواستی بعداً عکس خودت رو جایگزین کن
  const MEME_DATA_URI =
    "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjY4MCIgdmlld0JveD0iMCAwIDEyMDAgNjgwIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNlOGQ5ZDAiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZDJjNGI1Ii8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogICA8L2RlZnM+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNjgwIiBmaWxsPSJ1cmwoI2cpIi8+CiAgPGcgZmlsbD0iIzE0MTgxYSIgb3BhY2l0eT0iMC44NSI+CiAgICA8cmVjdCB4PSI3NDAiIHk9IjQ1MCIgd2lkdGg9IjQwMCIgaGVpZ2h0PSIxNjAiIHJ4PSIyNCIvPgogICA8L2c+CiAgPHRleHQgeD0iOTQwIiB5PSI1NTUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iNzIiIGZvbnQtZmFtaWx5PSJWYXppcm1hdG4sIFRhaG9tYSwgQXJpYWwsIHNhbnMtc2VyaWYiIGZpbGw9IiNmZmYiIGRpcmVjdGlvbj0icnRsIiB1bmljb2RlLWJpZGk9InBsYWludGV4dCI+2KLYr9mFINio2KfYsdqHPC90ZXh0PgogIDx0ZXh0IHg9IjYwMCIgeT0iMjgwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjU0IiBmb250LWZhbWlseT0iVmF6aXJtYXRuLCBUYWhvbWEsIEFyaWFsLCBzYW5zLXNlcmlmIiBmaWxsPSIjMjAyNDI2IiBkaXJlY3Rpb249InJ0bCIgdW5pY29kZS1iaWRpPSJwbGFpbnRleHQiPtmI2KfYsdmB2KfYryDYp9mE2KzYp9mGPC90ZXh0Pgo8L3N2Zz4=";

  memeImg.src = MEME_DATA_URI;

  const initialYes = { left: yesBtn.style.left, top: yesBtn.style.top };
  const initialNo  = { left: noBtn.style.left,  top: noBtn.style.top  };

  let noCount = 0;
  let yesScale = 1;

  // جلوگیری از چند بار شمردن پشت سر هم به خاطر لرزش موس
  let lastCountAt = 0;
  const COOLDOWN_MS = 250;

  function moveNo(){
    const stageRect = stage.getBoundingClientRect();
    const btnRect   = noBtn.getBoundingClientRect();

    const x = Math.random() * (stageRect.width  - btnRect.width);
    const y = Math.random() * (stageRect.height - btnRect.height);

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";
  }

  function countNoOnce(){
    const now = Date.now();
    if (now - lastCountAt < COOLDOWN_MS) return;
    lastCountAt = now;

    noCount++;

    yesScale += 0.10;
    yesBtn.style.transform = `scale(${yesScale})`;

    if(noCount >= 3){
      showMeme();
    }
  }

  function showMeme(){
    meme.classList.add("show");
    yesBtn.style.display = "none";
    noBtn.style.display  = "none";
    result.classList.remove("show");
  }

  function resetAll(){
    meme.classList.remove("show");
    result.classList.remove("show");

    yesBtn.style.display = "block";
    noBtn.style.display  = "block";

    noCount = 0;
    yesScale = 1;
    yesBtn.style.transform = "scale(1)";

    yesBtn.style.left = initialYes.left;
    yesBtn.style.top  = initialYes.top;

    noBtn.style.left  = initialNo.left;
    noBtn.style.top   = initialNo.top;
  }

  // دکمه نه: هر بار فرار => +1
  noBtn.addEventListener("mouseenter", () => {
    if (meme.classList.contains("show")) return;
    countNoOnce();
    moveNo();
  });

  noBtn.addEventListener("touchstart", () => {
    if (meme.classList.contains("show")) return;
    countNoOnce();
    moveNo();
  }, {passive:true});

  // اگر هم موفق شد کلیک کنه، باز هم بشمر
  noBtn.addEventListener("click", (e)=>{
    e.preventDefault();
    e.stopPropagation();
    if (meme.classList.contains("show")) return;
    countNoOnce();
    moveNo();
  });

  yesBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    if (meme.classList.contains("show")) return;
    result.classList.add("show");
  });

  // وقتی عکس اومد: کلیک روی عکس یا هرجای استیج => ریست
  meme.addEventListener("click", (e)=>{ e.stopPropagation(); resetAll(); });
  stage.addEventListener("click", ()=>{
    if (meme.classList.contains("show")) resetAll();
  });
</script>

</body>
</html>
